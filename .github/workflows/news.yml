name: Update news
on:
  schedule: [{cron: "15 * * * *"}]   # hourly
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install feedparser anthropic
      - run: python fetch_news.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: |
          git config user.name "news-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs/news.json
          git diff --cached --quiet || (git commit -m "Update news" && git push)
